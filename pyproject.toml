[project]
name = "video-agent"
version = "0.1.0"
description = "Windows video meeting recording agent with pluggable meeting providers."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.0",
  "pywinauto>=0.6.8",
  "obsws-python>=1.7.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "minio>=7.2.0",
  "cryptography>=42.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
