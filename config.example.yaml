agent:
  agent_id: "recorder-001"
  poll_interval_seconds: 15
  prepare_before_minutes: 5
  max_retries: 3
  close_apps_after_task: true

platform:
  base_url: "https://grcs-test.astronergy.com/"
  api_token: ""
  app_id: "iectp_collector"
  app_secret: "490d886b456b423fb933ed2defacc73c"
  tenant_id: 1
  token_path: "/api/iectp/api/open/token"
  pending_tasks_path: "/api/iectp/externalRecord/pendingTasks"
  start_callback_path: "/api/iectp/externalRecord/startCallback"
  complete_callback_path: "/api/iectp/externalRecord/completeCallback"
  headers:
    x-userid: "428724"
    x-tenantId: "1"
    x-accountno: "241024010"
  provider_aliases:
    腾讯会议: "tencent_meeting"
    Tencent Meeting: "tencent_meeting"
    钉钉: "dingtalk"
    DingTalk: "dingtalk"
    dingtalk: "dingtalk"
    觅讯: "mixlink"
    MixLink: "mixlink"
    mixlink: "mixlink"
    抖音: "douyin_live"
    抖音直播: "douyin_live"
    Douyin: "douyin_live"
    Douyin Live: "douyin_live"
    微信直播: "wechat_live"
    视频号直播: "wechat_live"
    视频号: "wechat_live"
  rsa_private_key_path: "config/iectp_rsa_private.pem"
  rsa_public_key_path: "config/iectp_rsa_public.pem"
  rsa_generate_if_missing: true
  rsa_decrypt_passwords: true
  timeout_seconds: 20

obs:
  executable_path: ""
  websocket_host: "127.0.0.1"
  websocket_port: 4455
  websocket_password: ""
  startup_timeout_seconds: 90
  recordings_dir: "recordings"
  # 录制期间自动静音 OBS 的麦克风/Aux，结束后恢复原状态。
  mute_microphone_during_recording: true

upload:
  part_size_bytes: 5242880
  retry_count: 3

minio:
  endpoint: "http://10.121.9.6:9000/"
  access_key: "replace-me"
  secret_key: "replace-me"
  bucket_name: "xny-iectp"
  secure: false
  object_prefix: "external-record"

providers:
  tencent_meeting:
    executable_path: ""
    window_title_regex: "腾讯会议|Tencent Meeting"
    login_retry_count: 2
    join_retry_count: 2
    meeting_end_poll_seconds: 5
    meeting_window_reconnect_seconds: 5
    capture_health_check_seconds: 5
  dingtalk:
    executable_path: ""
    window_title_regex: "钉钉|DingTalk|Ding"
    login_retry_count: 2
    join_retry_count: 2
    meeting_end_poll_seconds: 5
    password_prompt_timeout_seconds: 15
    startup_timeout_seconds: 90
    # The CEF meeting home does not expose card controls.  This anchor is
    # relative to its browser_window container, not the full DingTalk window.
    home_join_webview_anchor: [0.31, 0.21]
  mixlink:
    executable_path: "D:\\Chint\\MixLink\\EzEasyLink.exe"
    login_retry_count: 2
    join_retry_count: 2
    meeting_end_poll_seconds: 5
    startup_timeout_seconds: 45
    password_prompt_timeout_seconds: 15
  douyin_live:
    executable_path: ""
    # A separate browser profile keeps recordings isolated from the user's Chrome.
    profile_dir: ""
    debugging_port: 9229
    playback_timeout_seconds: 45
    end_poll_seconds: 5
    end_delay_seconds: 5
    capture_health_check_seconds: 5
  wechat_live:
    executable_path: ""
    window_title_regex: "微信|WeChat|Weixin"
    startup_timeout_seconds: 45
    navigation_timeout_seconds: 15
    page_transition_timeout_seconds: 30
    navigation_settle_seconds: 3
    # Each icon click is accepted only after its destination page is visible.
    # This makes slow network/icon rendering retry safely instead of stalling.
    icon_click_retry_count: 3
    icon_click_settle_seconds: 4
    refresh_poll_seconds: 5
    follow_scroll_max_pages: 80
    # These ratios are only fallbacks when the installed WeChat build exposes
    # no accessible name for the matching icon. Tune them with inspect_wechat.
    video_channel_click_ratio: [0.042, 0.475]
    # Icon-only controls use edge anchors so resolution changes do not shift
    # the click location. Keep the ratio values below as legacy fallbacks.
    profile_click_anchor: ["right", 43, "top", 94]
    follow_click_anchor: ["left", 109, "top", 181]
    profile_click_ratio: [0.973, 0.083]
    follow_click_ratio: [0.07, 0.16]
    refresh_click_ratio: [0.07, 0.10]
    capture_health_check_seconds: 5
